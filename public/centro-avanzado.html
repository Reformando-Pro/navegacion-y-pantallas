<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1928"><title>Reformando · Centro avanzado V3</title><style>
:root{color-scheme:dark;--bg:#081521;--surface:#14283d;--raised:#1e3953;--border:#58738f;--text:#f5faff;--muted:#d1dfed;--blue:#5399f5;--green:#6bdfb5;--shadow:#02091377}
*{box-sizing:border-box}html{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg)}body{margin:0;font-size:16px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #afd6ff;outline-offset:2px}a{color:#b7d7ff}h1{font-size:clamp(25px,3.5vw,36px);margin:0 0 5px}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 7px}p{line-height:1.65;margin:8px 0}.muted{color:var(--muted)}small,.small{font-size:14px;color:var(--muted)}.shell{max-width:1180px;margin:0 auto;padding:18px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:-.03em}.mark{display:grid;place-items:center;background:var(--blue);border-radius:10px;width:36px;height:36px;color:#061525}.role{min-width:205px}.badge{display:inline-block;color:#d4e9ff;background:#24486b;border:1px solid #7eabde;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:750}.menu{display:flex;gap:8px;overflow-x:auto;padding:8px 0 18px}.tab{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:12px 14px;border-radius:11px;white-space:nowrap;font-weight:650;font-size:14px}.tab.active{background:#2466b8;border-color:#9bcbff}.card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:20px;margin-bottom:14px;box-shadow:0 10px 25px var(--shadow)}.notice{background:#203c58;border-color:#75a6d6}.notice strong{color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;background:var(--raised);border:1px solid var(--border);border-radius:10px;font-size:14px;font-weight:750;min-height:42px}.button.primary,.btn.primary{background:#2879df;border-color:#86baff;color:#fff}.btn.green{background:#136e58;border-color:#69d9b0}.btn:disabled{opacity:.55;cursor:not-allowed}.label{display:block;font-weight:750;margin:10px 0 6px;font-size:14px;color:#e4f0fa}.input{background:#0a1b2b;border:1px solid #7997b6;border-radius:9px;padding:12px;width:100%;min-height:45px}.input:disabled{opacity:.7}.stack{display:grid;gap:10px}.line{border:1px solid #58738f;border-radius:11px;padding:13px;background:#1b344b}.metric{font-size:26px;font-weight:800;letter-spacing:-.04em}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:15px}.steps button{padding:12px 5px;border:1px solid #829bb4;border-radius:9px;background:#20364c;color:#e5eff8;font-size:13px;font-weight:750}.steps button.active{background:#2869b6;border-color:#b3d4ff;color:#fff}.progress{background:#395a77;border-radius:99px;height:10px;overflow:hidden}.progress>span{display:block;background:#5aaff9;height:100%;border-radius:99px}.money{font-weight:800;font-size:22px}.pricebar{position:sticky;bottom:9px;z-index:8;background:#203a55;border:1px solid #8ab3d9;border-radius:13px;padding:15px;box-shadow:0 8px 30px #0009;margin-top:15px}.colform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pill{border:1px solid #769bbb;border-radius:99px;padding:7px 11px;background:#23415f;font-size:14px}.pill.selected{border-color:#a8d1ff;background:#2c669d}.warning{color:#ffe0a8}.ok{color:#a5f2d6}.hide{display:none}.mobile-actions{display:flex;flex-wrap:wrap;gap:8px}.footer{padding:20px 0;color:#cbd9e6;font-size:13px}textarea.input{min-height:90px;resize:vertical}select option{background:#172d44;color:#fff}
@media(max-width:650px){.shell{padding:14px 12px 90px}.grid,.grid3,.colform{grid-template-columns:1fr}.card{padding:16px}.top{align-items:flex-start}.role{width:100%}.steps button{font-size:12px;padding:11px 2px}.row{align-items:stretch}.row>:is(button,.btn){min-width:0}.metric{font-size:25px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="mark">R</span><span>reformando <small>V3</small></span></div><span class="badge">MOCKUP · SIN BACKEND</span><select id="role" aria-label="Perfil de demostración" class="input role"><option value="gerente">Administrador / gerente</option><option value="comercial">Comercial / presupuestador</option><option value="jefe">Jefe de obra</option><option value="trabajador">Trabajador</option><option value="proveedor">Proveedor</option><option value="cliente">Cliente</option></select></header><nav id="nav" class="menu" aria-label="Navegación principal"></nav><section id="app" aria-live="polite"></section><footer class="footer"><a href="./">← Volver al primer mockup</a> · Reformando V3 · Interacciones locales y datos ficticios. No se envían mensajes, aceptaciones ni notificaciones reales.</footer></main>
<script>
(()=>{'use strict';const KEY='reformando-v3-state',BRIDGE='reformando-v3-bridge';const sample={name:'Reforma baño principal · Vivienda García',client:'Ana García',address:'Calle Serrano, Madrid',status:'borrador',version:0,history:[],conditions:'Los materiales aportados por el cliente deberán estar disponibles antes del inicio de su instalación.',vat:21,discount:0,rooms:['Baño principal'],lines:[{id:'l1',room:'Baño principal',name:'Demolición de revestimiento',trade:'Demoliciones',unit:'m²',qty:32,price:15,cost:9,enabled:true},{id:'l2',room:'Baño principal',name:'Alicatado pared baño',trade:'Alicatados',unit:'m²',qty:32,price:42,cost:27,enabled:true},{id:'l3',room:'Baño principal',name:'Fontanería baño completo',trade:'Fontanería',unit:'ud',qty:1,price:780,cost:490,enabled:true}],materials:[{id:'m1',name:'Azulejos del baño',source:'cliente',status:'Pendiente de entrega',transport:'cliente',date:'2026-11-12',price:0,courtesy:false}],annexes:[],tasks:[{id:'t1',name:'Demolición de revestimiento',status:'Terminada',hours:8,pct:100,approved:true},{id:'t2',name:'Alicatado pared baño',status:'En curso',hours:6,pct:65,approved:false},{id:'t3',name:'Instalación de sanitarios',status:'Pendiente',hours:0,pct:0,approved:false}],messages:[],delay:true,delayApproved:false,work:false};let model;try{model=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(sample)}catch{model=JSON.parse(JSON.stringify(sample))}let bridge=null;try{bridge=JSON.parse(localStorage.getItem(BRIDGE)||'null');if(bridge){localStorage.removeItem(BRIDGE);model={...structuredClone(sample),...bridge,rooms:[...new Set((bridge.lines||[]).map(x=>x.room))],materials:structuredClone(sample.materials),tasks:structuredClone(sample.tasks),status:'borrador',version:0,history:[],annexes:[],work:false};if(!model.rooms.length)model.rooms=['Baño principal']}}catch{}let role='gerente',page=bridge?'presupuesto':'inicio',step=0,expanded='',notice='',mode='semana';const roles=['gerente','comercial','jefe','trabajador','proveedor','cliente'];const labels={inicio:'Inicio',presupuesto:'Presupuesto',obra:'Mi obra',tareas:'Tareas',materiales:'Materiales',cliente:'Mensajes',plan:'Planificación',anexos:'Anexos',mas:'Más'};const routes={gerente:['inicio','presupuesto','obra','plan','tareas','materiales','anexos','cliente'],comercial:['inicio','presupuesto','cliente','obra','anexos'],jefe:['inicio','obra','plan','tareas','materiales','anexos','cliente'],trabajador:['inicio','tareas','plan','cliente'],proveedor:['inicio','materiales','cliente'],cliente:['inicio','presupuesto','obra','materiales','anexos','cliente']};const $=id=>document.getElementById(id);const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cash=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);const sum=()=>model.lines.filter(x=>x.enabled).reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0);const cost=()=>model.lines.filter(x=>x.enabled).reduce((s,x)=>s+(+x.qty||0)*(+x.cost||0),0);const base=()=>sum()*(1-(+model.discount||0)/100);const total=()=>base()*(1+(+model.vat||0)/100)+model.annexes.filter(x=>x.status==='aceptado').reduce((s,x)=>s+x.delta,0);const margin=()=>base()>0?100*(base()-cost())/base():0;const editable=()=>!['firmado','obra'].includes(model.status);const privateRole=()=>['gerente','comercial','jefe'].includes(role);const canPrice=()=>['gerente','comercial'].includes(role);const card=(inner,cl='')=>`<article class="card ${cl}">${inner}</article>`;const btn=(t,a,c='')=>`<button class="btn ${c}" data-action="${a}">${t}</button>`;const row=(l,v)=>`<div class="row"><span class="muted">${l}</span><strong>${v}</strong></div>`;function save(){try{localStorage.setItem(KEY,JSON.stringify(model))}catch{}}function ping(s){notice=s;render()}function go(p){if(routes[role].includes(p)){page=p;step=0;notice='';render()}}function field(label,key,value,type='text',opts=''){return `<label class="label">${label}<input class="input" data-field="${key}" type="${type}" value="${e(value)}" ${opts}></label>`}
function render(){if(!routes[role].includes(page))page='inicio';$('role').value=role;$('nav').innerHTML=routes[role].map(p=>`<button class="tab ${page===p?'active':''}" data-action="go:${p}">${labels[p]}</button>`).join('');let h='';if(notice)h+=card(`<strong>${e(notice)}</strong>`,'notice');if(page==='inicio'){const titles={gerente:'Visión de tu empresa',comercial:'Actividad comercial',jefe:'Organiza tu jornada',trabajador:'Tus tareas del día',proveedor:'Tus suministros',cliente:'Tu reforma al día'};h+=`<h1>${titles[role]}</h1><p class="muted">Proyecto de demostración · ${e(model.name)}</p>`+card(`<div class="grid3"><div><span class="muted">Proyecto</span><div class="metric">${model.work?'En obra':'Presupuesto'}</div></div><div><span class="muted">Presupuesto</span><div class="metric">${canPrice()||role==='cliente'?cash(total()):'Según permisos'}</div></div><div><span class="muted">Tareas</span><div class="metric">${model.tasks.length}</div></div></div>`);h+=card(`<h2>Continuar la demostración</h2><p>Revisa el presupuesto, visualiza la obra y cambia de perfil para comprobar los permisos simulados.</p><div class="mobile-actions">${btn('Ver presupuesto','go:presupuesto','primary')}${btn('Abrir obra','go:obra')}${btn('Restaurar demo','reset')}</div>`)}
else if(page==='presupuesto'){h+=`<h1>${role==='cliente'?'Tu presupuesto':model.name}</h1><p class="muted">Cliente: ${e(model.client)} · ${e(model.address)} · Estado: <strong>${e(model.status)}</strong></p>`;if(role==='cliente'){h+=card(`<h2>Importe de tu propuesta</h2><div class="metric">${cash(total())}</div><p>Solo la última versión enviada está disponible para su aceptación. Los costes internos nunca se muestran al cliente.</p>${model.status==='enviado'?btn('Estoy de acuerdo · simulación','accept','green'):''} ${btn('Solicitar información','go:cliente')}`);h+=card(`<h2>Partidas</h2>${model.lines.filter(x=>x.enabled).map(x=>row(e(x.name)+' · '+e(x.qty)+' '+e(x.unit),cash(x.qty*x.price))).join('<hr>')}`)}else{h+=`<div class="steps">${['1. Estancias','2. Partidas','3. Precios','4. Revisión'].map((x,i)=>`<button data-action="step:${i}" class="${step===i?'active':''}">${x}</button>`).join('')}</div>`;if(step===0)h+=card(`<h2>Estancias y alcance</h2><p>Las estancias se usan para agrupar las partidas, sin duplicarlas por gremio.</p><div class="stack">${model.rooms.map((x,i)=>`<div class="line row"><strong>${e(x)}</strong><div>${btn('Renombrar','rename:'+i)} ${editable()?btn('Duplicar','duplicate:'+i):''}</div></div>`).join('')}</div>${editable()?field('Nueva estancia','newroom','')+btn('Añadir estancia','addroom','primary'):''}`);if(step===1)h+=card(`<h2>Partidas editables</h2><p class="muted">Selección de partidas por estancia y oficio.</p>${model.lines.map((x,i)=>`<div class="line" style="margin-bottom:9px"><div class="row"><strong>${e(x.name)}</strong><button class="btn" data-action="expand:${i}">${expanded===String(i)?'Cerrar':'Editar'} detalles</button></div><small>${e(x.room)} · ${e(x.trade)}</small>${expanded===String(i)?`<div class="colform">${field('Cantidad','qty:'+i,x.qty,'number','step="0.1" min="0"')}${field('Precio venta unitario','price:'+i,x.price,'number','step="0.01" min="0"')}${field('Coste interno unitario','cost:'+i,x.cost,'number','step="0.01" min="0"')}${field('Unidad','unit:'+i,x.unit)}</div>`:''}</div>`).join('')}${editable()?btn('Añadir partida','newline','primary'):''}`);if(step===2)h+=card(`<h2>Precios y rentabilidad</h2>${field('Descuento global (%)','discount',model.discount,'number','min="0" max="100"')}${field('IVA (%)','vat',model.vat,'number','min="0" max="100"')}${row('Base de venta',cash(base()))}${row('Costes internos',cash(cost()))}${row('Margen bruto estimado',margin().toFixed(1)+' %')}`);if(step===3)h+=card(`<h2>Revisión y envío</h2>${field('Cliente','client',model.client)}${field('Dirección','address',model.address)}<label class="label">Condiciones editables<textarea class="input" data-field="conditions">${e(model.conditions)}</textarea></label><p>Las versiones enviadas conservan un registro histórico. Solo la última puede aceptarse.</p><div class="mobile-actions">${editable()?btn('Enviar versión comercial · simulación','send','primary'):btn('Ver como cliente','preview')}</div>`);h+=card(`<h3>Historial de versiones</h3>${model.history.length?model.history.map(x=>`<div class="line">V${x.number} · ${cash(x.total)} · ${e(x.date)} · Solo consulta</div>`).join(''):'Sin versiones enviadas'}`);h+=`<div class="pricebar"><div class="row"><div><small>VENTA ESTIMADA · CON IVA</small><div class="money">${cash(total())}</div></div><div style="text-align:right"><small>Margen interno</small><div class="ok"><strong>${margin().toFixed(1)} %</strong></div></div></div></div>`;if(!editable())h+=card(`<p>Este presupuesto firmado no se modifica. Los cambios se registran mediante anexos independientes.</p>${btn('Crear anexo','go:anexos')}`)}}
else if(page==='obra'){h+=`<h1>${e(model.name)}</h1><p class="muted">Resumen ejecutivo · ${model.work?'Obra en ejecución':'Pendiente de convertir'}</p>`+card(`<h2>Estado de la obra</h2>${row('Avance de tareas',Math.round(model.tasks.reduce((s,x)=>s+x.pct,0)/model.tasks.length)+' %')}<div class="progress"><span style="width:${Math.round(model.tasks.reduce((s,x)=>s+x.pct,0)/model.tasks.length)}%"></span></div>${!model.work&&privateRole()?btn('Convertir presupuesto en obra · simulado','convert','primary'):''}`)+card(`<h2>Necesita atención</h2><p>${model.delay?'La entrega de azulejos retrasa los trabajos dependientes. Reprogramación sujeta a aprobación.':'No hay retrasos pendientes en la demo.'}</p>${model.delay&&privateRole()?btn('Revisar propuesta de planificación','go:plan'):''}`)+card(`<h2>Accesos de la obra</h2><div class="mobile-actions">${['plan','tareas','materiales','anexos','cliente'].filter(x=>routes[role].includes(x)).map(x=>btn(labels[x],'go:'+x)).join('')}</div>`)}
else if(page==='plan'){h+=`<h1>Planificación conectada</h1><p class="muted">Calendario semanal y cronograma comparten el mismo seguimiento.</p>`+card(`<div class="mobile-actions">${btn('Calendario','view:semana',mode==='semana'?'primary':'')}${btn('Cronograma','view:gantt',mode==='gantt'?'primary':'')}</div>${mode==='semana'?['Lunes: Demolición','Martes: Instalaciones','Miércoles: Entrega materiales','Jueves: Alicatado','Viernes: Revisión'].map(x=>`<div class="line" style="margin-top:9px">${x}</div>`).join(''):['Demoliciones','Instalaciones','Revestimientos','Remates'].map((x,i)=>`<div style="margin:12px 0"><strong>${x}</strong><div class="progress"><span style="width:${30+i*18}%"></span></div></div>`).join('')}`)+card(`<h2>Impacto del retraso</h2><p>Los azulejos aportados por el cliente están pendientes. Se propone reorganizar primero las tareas independientes.</p>${model.delay?btn('Aprobar reprogramación simulada','approve','primary'):'Propuesta aprobada en la demo.'}`)}
else if(page==='tareas'){
 h+=`<h1>Partes de trabajo</h1><p class="muted">Actualización rápida; detalle ampliable opcional.</p>`;
 h+=model.tasks.map((t,i)=>{
  let inside=`<h3>${e(t.name)}</h3>${row('Estado',e(t.status))}${row('Avance',e(t.pct)+' %')}<div class="progress"><span style="width:${t.pct}%"></span></div>`;
  inside+=`<div class="mobile-actions" style="margin-top:12px">${btn('Editar parte','edit-task:'+i)}${privateRole()&&t.status==='Terminada'&&!t.approved?btn('Validar','validate:'+i,'green'):''}</div>`;
  if(expanded==='task'+i){
   inside+=`<div class="colform">${field('Horas','hours:'+i,t.hours,'number','min="0"')}${field('Avance (%)','pct:'+i,t.pct,'number','min="0" max="100"')}</div>`;
   inside+=`<label class="label">Estado<select class="input" data-field="taskstatus:${i}">${['Pendiente','En curso','Terminada'].map(st=>`<option ${st===t.status?'selected':''}>${st}</option>`).join('')}</select></label>`;
   inside+=`<p class="small">Fotos y adjuntos: interfaz prevista, no hay subida real de archivos.</p>`;
  }
  return card(inside);
 }).join('');
}
else if(page==='materiales'){
 h+=`<h1>Materiales y compras</h1><p class="muted">Diferenciar suministro, instalación, entrega y transporte.</p>`;
 h+=model.materials.map((m,i)=>{
   let inside=`<h3>${e(m.name)}</h3>${row('Suministra',m.source==='cliente'?'Cliente':'Reformista')}${row('Estado',e(m.status))}${row('Transporte',m.transport==='cliente'?'Cliente':(m.courtesy?'Reformista · Gratis':'Reformista · '+cash(m.price||0)))}`;
   if(privateRole()||role==='cliente')inside+=`<label class="label">Estado<select class="input" data-field="materialstatus:${i}">${['Pendiente de elección','Elegido','Comprado','Pendiente de entrega','Entregado en obra'].map(st=>`<option ${st===m.status?'selected':''}>${st}</option>`).join('')}</select></label>`;
   if(privateRole()){
     inside+=`<label class="label">Transporte<select class="input" data-field="transport:${i}"><option value="cliente" ${m.transport==='cliente'?'selected':''}>Cliente</option><option value="reformista" ${m.transport==='reformista'?'selected':''}>Reformista</option></select></label>`;
     if(m.transport==='reformista')inside+=field('Precio transporte (€)','transportprice:'+i,m.price,'number','min="0"')+`<label class="label"><input type="checkbox" data-field="courtesy:${i}" ${m.courtesy?'checked':''}> Cortesía / gratis</label>`;
   }
   return card(inside);
 }).join('');
}
else if(page==='anexos'){
 h+=`<h1>Anexos al presupuesto</h1><p class="muted">El original firmado permanece inalterable. Los cambios se aprueban mediante anexos independientes.</p>`;
 h+=card(`<h2>Contrato original</h2>${row('Presupuesto original',cash(model.history.at(-1)?.total||base()))}${row('Anexos aceptados',cash(model.annexes.filter(a=>a.status==='aceptado').reduce((s,a)=>s+a.delta,0)))}${row('Total contractual',cash((model.history.at(-1)?.total||base())+model.annexes.filter(a=>a.status==='aceptado').reduce((s,a)=>s+a.delta,0)))}`);
 h+=model.annexes.map((a,i)=>{
  let inside=`<h3>${e(a.name)}</h3>${row('Delta del anexo',cash(a.delta))}${row('Estado',a.status)}`;
  if(a.status==='borrador'&&privateRole())inside+=field('Variación del presupuesto (€)','annex:'+i,a.delta,'number','step="0.01"')+btn('Enviar anexo · demo','sendannex:'+i,'primary');
  if(a.status==='enviado'&&role==='cliente')inside+=btn('Aceptar anexo · demo','acceptannex:'+i,'green');
  return card(inside);
 }).join('');
 if(privateRole()&&['firmado','obra'].includes(model.status))h+=btn('Nuevo presupuesto anexo','newannex','primary');
}
else if(page==='cliente'){h+=`<h1>Consultas y mensajes</h1><p class="muted">Conversaciones generales y consultas vinculadas a partidas, con trazabilidad comercial.</p>`+card(`<h2>Hilo de la obra</h2>${model.messages.length?model.messages.map(m=>`<div class="line" style="margin:8px 0"><strong>${e(m.who)} · ${e(m.about)}</strong><p>${e(m.text)}</p></div>`).join(''):'Sin consultas registradas'}<label class="label">Asunto<select class="input" id="subject"><option>Consulta general</option>${model.lines.map(x=>`<option>${e(x.name)}</option>`).join('')}</select></label><label class="label">Mensaje<textarea class="input" id="message" placeholder="Escribe una consulta…"></textarea></label>${btn('Añadir consulta a la demo','message','primary')}`)}
else h+=card(`<h2>Otros módulos</h2><p>El simulador mantiene seis roles, favoritos y permisos ilustrativos. Sin autenticación ni backend.</p>${btn('Restaurar datos','reset')}`);
$('app').innerHTML=h;}
function update(el){const f=el.dataset.field;if(!f)return;let v=el.type==='checkbox'?el.checked:el.value;let [name,i]=f.split(':');let obj;if(name==='client')model.client=v;else if(name==='address')model.address=v;else if(name==='conditions')model.conditions=v;else if(name==='discount')model.discount=+v;else if(name==='vat')model.vat=+v;else if(name==='qty'||name==='price'||name==='cost')model.lines[+i][name]=+v;else if(name==='unit')model.lines[+i].unit=v;else if(name==='hours')model.tasks[+i].hours=+v;else if(name==='pct')model.tasks[+i].pct=Math.max(0,Math.min(100,+v));else if(name==='taskstatus')model.tasks[+i].status=v;else if(name==='materialstatus')model.materials[+i].status=v;else if(name==='transport')model.materials[+i].transport=v;else if(name==='transportprice')model.materials[+i].price=+v;else if(name==='courtesy')model.materials[+i].courtesy=v;else if(name==='annex')model.annexes[+i].delta=+v;save();render()}
$('role').addEventListener('change',ev=>{role=ev.target.value;page='inicio';render()});document.addEventListener('change',ev=>{if(ev.target.dataset.field)update(ev.target)});document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action]');if(!b)return;const [a,arg]=b.dataset.action.split(':');if(a==='go'){go(arg);return}if(a==='step'){step=+arg;render();return}if(a==='expand'){expanded=expanded===arg?'':arg;render();return}if(a==='view'){mode=arg;render();return}if(a==='edit-task'){expanded=expanded==='task'+arg?'':'task'+arg;render();return}if(a==='reset'){model=structuredClone(sample);save();ping('Datos restaurados para la demo.');return}if(a==='addroom'){let x=document.querySelector('[data-field="newroom"]');if(x?.value.trim()&&!model.rooms.includes(x.value.trim()))model.rooms.push(x.value.trim());save();render();return}if(a==='duplicate'){let old=model.rooms[+arg],n=old+' (copia)';model.rooms.push(n);model.lines.push(...model.lines.filter(x=>x.room===old).map(x=>({...x,id:'l'+Math.random().toString(36).slice(2),room:n})));save();render();return}if(a==='rename'){let old=model.rooms[+arg],n=prompt('Nuevo nombre de estancia',old)?.trim();if(n){model.rooms[+arg]=n;model.lines.filter(x=>x.room===old).forEach(x=>x.room=n)}save();render();return}if(a==='newline'){model.lines.push({id:'l'+Date.now(),room:model.rooms[0],name:'Partida personalizada',trade:'Otros',unit:'ud',qty:1,price:0,cost:0,enabled:true});expanded=String(model.lines.length-1);save();render();return}if(a==='send'){if(!model.client.trim()||!model.address.trim()){ping('Faltan datos del cliente o la dirección.');return}model.version++;model.status='enviado';model.history.push({number:model.version,total:total(),date:new Date().toLocaleDateString('es-ES'),lines:structuredClone(model.lines)});save();ping('Versión '+model.version+' enviada en la simulación.');return}if(a==='preview'){role='cliente';page='presupuesto';save();render();return}if(a==='accept'){if(model.status==='enviado'){model.status='firmado';save();ping('Presupuesto aceptado en la simulación; original bloqueado.')}return}if(a==='convert'){if(model.status==='firmado'){model.work=true;model.status='obra';save();ping('Obra creada en la simulación.')}else ping('Primero debe estar aceptado el presupuesto.');return}if(a==='approve'){model.delay=false;model.delayApproved=true;save();ping('Reprogramación aprobada en la simulación.');return}if(a==='validate'){model.tasks[+arg].approved=true;save();ping('Tarea validada por el jefe de obra.');return}if(a==='newannex'){model.annexes.push({name:'Anexo '+(model.annexes.length+1)+' · Trabajos añadidos',delta:250,status:'borrador'});save();render();return}if(a==='sendannex'){model.annexes[+arg].status='enviado';save();ping('Anexo enviado para aceptación independiente.');return}if(a==='acceptannex'){model.annexes[+arg].status='aceptado';save();ping('Anexo aceptado y sumado al contrato.');return}if(a==='message'){let text=$('message')?.value.trim();if(text){model.messages.push({who:role,about:$('subject').value,text});save();ping('Consulta añadida al hilo simulado, sin modificar el presupuesto.')}return}});render();})();
